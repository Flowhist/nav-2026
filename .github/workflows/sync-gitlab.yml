name: Sync GitHub to GitLab

on:
  push:
    branches: ["**"]
    tags: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-to-gitlab-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: [self-hosted, Windows, X64, gitlab-mirror]
    timeout-minutes: 30
    steps:
      - name: Check out all history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror branches and tags to GitLab
        shell: pwsh
        env:
          GL_USER: ${{ secrets.GITLAB_USER }}
          GL_TOKEN: ${{ secrets.GITLAB_PAT }}
          GL_RAW_URL: ${{ secrets.GITLAB_URL }}
        run: |
          $ErrorActionPreference = "Stop"

          foreach ($name in "GL_USER", "GL_TOKEN", "GL_RAW_URL") {
            if ([string]::IsNullOrWhiteSpace((Get-Item "Env:$name").Value)) {
              throw "Required secret $name is missing."
            }
          }

          $gitLabUrl = $env:GL_RAW_URL.TrimEnd('/')
          if ($gitLabUrl -notmatch '^(https?)://(.+)$') {
            throw "GITLAB_URL must begin with http:// or https://."
          }

          $scheme = $Matches[1]
          $authorityAndPath = $Matches[2]
          if (-not $authorityAndPath.EndsWith('.git')) {
            $authorityAndPath += '.git'
          }

          $user = [Uri]::EscapeDataString($env:GL_USER)
          $token = [Uri]::EscapeDataString($env:GL_TOKEN)
          $remoteUrl = "${scheme}://${user}:${token}@${authorityAndPath}"

          git fetch --force --prune origin `
            "+refs/heads/*:refs/mirror/heads/*" `
            "+refs/tags/*:refs/tags/*"
          if ($LASTEXITCODE -ne 0) { throw "Fetching GitHub refs failed." }

          git push --force --prune $remoteUrl `
            "+refs/mirror/heads/*:refs/heads/*" `
            "+refs/tags/*:refs/tags/*"
          if ($LASTEXITCODE -ne 0) { throw "Pushing GitLab refs failed." }
