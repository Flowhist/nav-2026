# USB HID 摇杆配置。当前 SMC25/SMC30 Type-C 通过 /dev/input/js0 作为 HID 摇杆接入。

joy_control:
  ros__parameters:
    enabled: true
    dev: "/dev/input/js0"
    joy_topic: "/joy"
    state_topic: "/js_state"
    cmd_vel_topic: "/js_cmd_vel"
    publish_rate: 50.0
    reconnect_interval: 1.0

    # 当前安装实测：前后轴为 axes[1]，左右轴为 axes[0]。
    # 如果实测方向相反，只改对应 direction 的正负号。
    linear_axis: 1
    linear_direction: -1.0
    angular_axis: 0
    angular_direction: -1.0

    # 输入轴归一化后的死区和饱和区，范围通常为 0.0 ~ 1.0。
    # 连续控制下适当放大死区，降低摇杆中心轻微抖动带来的干扰。
    dead_zone: 0.05
    sat_zone: 1.0

    # 摇杆目标速度变化率限制：推杆用 accel，回位/换向用 decel。
    linear_accel_slew_rate: 1.5     # m/s^2
    linear_decel_slew_rate: 6.0     # m/s^2
    angular_accel_slew_rate: 180.0  # deg/s^2
    angular_decel_slew_rate: 360.0  # deg/s^2
