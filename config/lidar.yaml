# finav 统一雷达配置（建图/导航共用）
# 新雷达支持直接输出扇形扫描，因此不再经过额外的角度过滤节点。

lidar_ip: 192.168.1.112
frame_id: laser_frame
topic_name: /scan

is_ethernet: true
port_name: /dev/ttyUSB0
baud: 921600

scan_frequency: 30
scan_resolution: 1000

# 新雷达物理支持约 270°（-45° ~ 225°），实车因车身硬件遮挡裁剪为 20° ~ 160°。
# 发布给 ROS 的 laser_frame 保持右手系且 +Z 朝上；物理倒装导致的角度递增方向
# 通过 is_reverse_postion 反序修正。修正后雷达接收角 +90°（中线方向）对应车体 +X。
start_angle: 20
stop_angle: 160
offset_angle: 0

range_min: 0.05
range_max: 25.0

filter_switch: 0
single_filter_enable: false  # false: 保留原始scan；true: 启用厂商单点孤立滤波
cluster_num: 10
broad_filter_num: 20
nor_switch: 1
is_reverse_postion: true

# false: 使用发布时刻，兼容性最好；true: 使用一圈扫描首包接收时刻，便于排查运动畸变。
use_recv_time_stamp: false
