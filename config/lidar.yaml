# Finav 双 Hinson HE-3051 雷达配置（建图/导航共用）
# 两台驱动分别发布 /scan_left 和 /scan_right，最终由 scan_fusion_node 融合为 /scan。
# 下游 SLAM、Web、导航仍只使用 /scan。

left:
  scanner_ip: 10.86.81.111
  frame_id: laser_left_frame
  topic_name: /scan_left
  laser_port: 8080
  laser_type: 1
  use_udp: false
  synctype: false
  # 首次联调不改变雷达内部转速、分辨率或滤波参数。
  change_param: false
  # HE-3051 在厂商协议中用 30 表示实际 20 Hz。
  spin_frequency_hz: 30
  angle_increment: "0.100"
  noise_filter_level: 1
  # 0/0 在厂商驱动中表示不裁剪，安装方向由 URDF TF 描述。
  start_angle: 0.0
  end_angle: 0.0
  offset_angle: 0.0
  shadows_filter_level: 0
  disturb_filter_enable: false

right:
  scanner_ip: 10.86.81.112
  frame_id: laser_right_frame
  topic_name: /scan_right
  laser_port: 8080
  laser_type: 1
  use_udp: false
  synctype: false
  change_param: false
  spin_frequency_hz: 30
  angle_increment: "0.100"
  noise_filter_level: 1
  start_angle: 0.0
  end_angle: 0.0
  offset_angle: 0.0
  shadows_filter_level: 0
  disturb_filter_enable: false

fusion:
  # 双雷达融合后的统一 LaserScan 输出
  output_topic: /scan
  output_frame: base_link
  # 输出扫描角度范围与角分辨率
  angle_min: -3.141592653589793
  angle_max: 3.141592653589793
  angle_increment: 0.0017453292519943296
  # 融合后保留的有效量程
  range_min: 0.05
  range_max: 25.0
  # 同步队列和 TF 等待时间；丢帧/延迟时优先检查这里
  sync_queue_size: 10
  input_timeout_sec: 1.0
  tf_timeout_sec: 0.1
