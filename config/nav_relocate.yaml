relocate:
  ros__parameters:
    scan_topic: /scan
    initialpose_topic: /initialpose
    map_frame: map
    collect_scan_count: 5
    max_wait_scan_s: 12.0
    max_scan_points: 360
    min_range_m: 0.10
    max_range_m: 12.0
    scan_to_base_x_m: 0.0
    scan_to_base_y_m: 0.0
    scan_to_base_yaw_deg: 0.0
    coarse_xy_step_m: 0.25
    coarse_yaw_step_deg: 10.0
    enable_fast_coarse_search: true
    coarse_prefilter_xy_step_m: 0.50
    coarse_prefilter_top_k: 80
    coarse_refine_radius_m: 0.35
    fallback_full_search: true
    # 低置信fallback默认只在fast候选附近扩展，不直接全图重扫。
    fallback_limited_search: true
    fallback_limited_radius_m: 1.2
    fallback_limited_max_candidates: 8000
    fine_xy_radius_m: 0.30
    fine_xy_step_m: 0.05
    fine_yaw_radius_deg: 10.0
    fine_yaw_step_deg: 2.0
    top_k: 10
    max_endpoint_dist_m: 0.55
    match_sigma_m: 0.16
    min_score: 0.40
    min_score_gap: 0.055
    free_candidate_stride: 1
    debug: false
