relocate:
  ros__parameters:
    # 输入/输出话题与坐标系
    scan_topic: /scan
    initialpose_topic: /initialpose
    map_frame: map
    # 扫描采集：收集多帧后合并，点数越多越稳但越慢
    collect_scan_count: 5
    max_wait_scan_s: 12.0
    max_scan_points: 540
    # 扫描点有效量程
    min_range_m: 0.10
    max_range_m: 12.0
    # /scan 到 base_link 的外参；当前融合 scan 已在 base_link 下
    scan_to_base_x_m: 0.0
    scan_to_base_y_m: 0.0
    scan_to_base_yaw_deg: 0.0
    # 粗搜索分辨率：步长越小越准但越慢
    coarse_xy_step_m: 0.25
    coarse_yaw_step_deg: 10.0
    # 快速粗搜索：先稀疏筛选，再在候选附近细化
    enable_fast_coarse_search: true
    coarse_prefilter_xy_step_m: 0.50
    coarse_prefilter_top_k: 80
    coarse_refine_radius_m: 0.35
    # 低置信时先局部扩展，仍不明确再全图搜索
    fallback_full_search: true
    fallback_limited_search: true
    fallback_limited_radius_m: 1.2
    fallback_limited_max_candidates: 8000
    # 快搜仅高分时直接接受；中等分数即使分差足够，也需扩大搜索验证
    fast_accept_score: 0.70
    # 精搜索范围与分辨率，用于最终姿态微调
    fine_xy_radius_m: 0.30
    fine_xy_step_m: 0.05
    fine_yaw_radius_deg: 10.0
    fine_yaw_step_deg: 2.0
    # 保留的候选数量
    top_k: 12
    # 将相邻小误差视为同一候选，保留不同位置/朝向的假设
    hypothesis_separation_m: 0.50
    hypothesis_separation_deg: 15.0
    # 粗搜索容忍采样误差，精搜索仍使用下方 match_sigma_m
    coarse_match_sigma_m: 0.30
    # 对激光射线穿过地图障碍的候选扣分
    ray_obstacle_penalty: 0.35
    # 离线对照选用的组合：候选验证后只微调前三个，验证分数下降则保留原候选
    candidate_ray_validation: true
    continuous_refinement: true
    continuous_refine_candidates: 3
    precomputed_scores: true
    # 实验项：平均更快，但个别场景变慢，因此默认关闭
    multiscale_coarse_search: false
    # 匹配评分参数：贴墙/点云偏移时可适当放宽 sigma 或阈值
    max_endpoint_dist_m: 0.55
    match_sigma_m: 0.16
    min_score: 0.40
    min_score_gap: 0.001
    # 候选降采样与调试日志
    free_candidate_stride: 1
    debug: false
