path_plan:
  ros__parameters:
    # ===== 话题与坐标系 =====
    # 地图输入（OccupancyGrid）
    map_topic: "/map"
    # 目标点输入（PoseStamped）
    goal_topic: "/goal_pose"
    # 规划结果输出（nav_msgs/Path）
    path_topic: "/plan"
    # 全局坐标系（通常是 map）
    map_frame: "map"
    # 机器人基座坐标系（通常是 base_link）
    base_frame: "base_link"
    # 规划频率(Hz)：提高到 5Hz，减小点目标后的等待感
    plan_rate_hz: 2.0
    # fast2d: 快速2D全局规划；se2: 旧的带航向/车体运动原语规划
    planner_mode: "fast2d"
    # fast2d失败时是否自动退回SE2；默认关闭，避免失败目标长时间卡住。
    fast2d_allow_se2_fallback: false

    # ===== 栅格判定与碰撞安全 =====
    # 占用阈值(0~100)：越小越保守（更多格子视为障碍）
    occupied_threshold: 65
    # 未知区域是否按障碍处理：true更安全，false更激进
    treat_unknown_as_occupied: true
    # 障碍额外安全边界(米)：减小一点，提高窄通道通过率
    inflation_radius_m: 0.7
    # 搜索扩展上限：越大越不易失败，但最坏耗时更长
    max_search_expansions: 200000
    # 单次规划最大耗时，防止坏目标长期占住单线程节点
    max_planning_time_s: 2.5
    # 目标点落在障碍/未知/膨胀区时直接拒绝，不尝试吸附到附近空地
    reject_occupied_goal: true
    # 到目标判定容差(米)：越小越精确
    goal_tolerance_m: 0.12
    # false: 终点姿态保持沿路径切线，避免仿真到点时瞬间跳成 goal 朝向
    align_final_pose_yaw_to_goal: false
    # 新 goal 到来时先发布空路径，让控制器立即停下等待新路径
    stop_on_new_goal_clear_path: true
    # 任意重规划触发时先清空当前路径，停车等待下一拍新路径
    stop_before_replan_clear_path: true

    # -------------- 以下均用于se2路径规划，暂时不再使用 ---------------

    # ===== 车体几何（与 URDF 对齐）=====
    # base_link 到车头最前端
    vehicle_front_m: 0.84
    # base_link 到车尾最后端
    vehicle_rear_m: 0.25
    # base_link 到车体左侧边缘
    vehicle_left_m: 0.45
    # base_link 到车体右侧边缘
    vehicle_right_m: 0.45
    # 在矩形车体外再加的安全边距
    vehicle_margin_m: 0.03
    # 足迹采样间距：适度放宽，换取更快的碰撞检测
    footprint_sample_step_m: 0.10

    # ===== 朝向离散与运动原语 =====
    # 航向离散数：16 -> 每格 22.5 度
    heading_bins: 16
    # 单步扩展长度(米)：步子稍大，加快搜索
    primitive_step_m: 0.24
    # 单步允许的航向变化（离散 bin 数）
    primitive_turn_bins: 1
    # 允许原地旋转，调头/急拐角时避免用大量小弧线绕方向
    enable_turn_in_place: true
    # 原地旋转一步的基础代价，过小会偏爱原地摆头，过大则调头收益降低
    turn_in_place_cost: 0.18
    # 转弯代价倍率
    turn_cost_weight: 0.20
    # 规划耗时统计日志节流间隔，0 表示关闭
    timing_log_interval_s: 1.0

    # ===== SE2搜索空间裁剪（仅 planner_mode=se2 或 fast2d fallback 时使用）=====
    # 用轻量2D A*生成粗路径走廊，再在走廊内做SE2 A*。
    enable_search_corridor: true
    # 走廊半径(米)：越小越快但越容易裁掉需要绕行/摆头的可行空间。
    search_corridor_radius_m: 1.2
    # 2D粗路径最大扩展数，防止异常目标拖慢。
    search_corridor_max_expansions: 200000

    # ===== 重规划与平滑 =====
    # 地图更新时是否触发重规划
    replan_on_map_update: false
    # 偏离路径触发重规划阈值(米)：越小越敏感
    replan_deviation_m: 0.25
    # 一次 shortcut 允许直连的最大长度(米)：越大折点更少
    smooth_max_segment_m: 2.0
    # 路径输出的最小姿态间隔
    path_pose_spacing_m: 0.10
    # Weighted A* 启发式权重（>=1）：越大通常越快，但路径最优性会下降
    heuristic_weight: 1.35
    # 启发式朝向代价权重（m/rad）：适度增大可减少无效摆头搜索
    heuristic_heading_weight: 0.10
