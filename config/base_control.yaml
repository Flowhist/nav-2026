# 基础参数配置
base_control:
  ros__parameters:

    # ==================== 车轮参数 ====================
    wheel_radius:     0.127    # 轮半径（m）= 直径 25.4cm / 2
    wheel_separation: 0.60      # 轮距（m）= 60cm

    # ==================== 发布频率 ====================
    update_rate: 10.0          # 里程计刷新频率（Hz）
    cmd_send_rate: 50.0        # 控制指令下发频率（Hz）
    cmd_timeout: 0.35          # 超过该时间未收到新 cmd_vel 则自动归零（s）

    # ==================== CAN 总线 ====================
    can_channel:   'PCAN_USBBUS1'
    can_baud_rate: 500000
    wheel_velocity_sign: -1.0   # 电机速度正方向与 ROS 车体前进方向相反时设为 -1
    left_motor_id: 1           # 实车左轮对应的 WHILL/CAN 电机编号
    right_motor_id: 2          # 实车右轮对应的 WHILL/CAN 电机编号

    # ==================== 速度控制(cmd_vel) ====================
    # 【驱动层硬限制】：这里的速度值是底盘驱动的安全上界，超出会被强制截断
    #  实际运动速度由上层控制器决定
    cmd_vel_topic: '/cmd_vel'
    max_linear_speed: 0.6                # 线速硬限（m/s）
    max_angular_speed: 0.5               # 角速硬限（rad/s）
    acceleration: 150                    # 非零速度指令使用的加速度（deg/s²）
    acceleration_stop: 400               # 目标双轮归零时使用的特殊加速度（deg/s²）
    # omnilibs 隔离进程：调用卡死时强制回收，重启后必须先收到一次 0 速复位
    driver_startup_timeout_s: 8.0        # 驱动加载与首次零速的最长等待时间
    driver_request_timeout_s: 0.5        # 单次 CAN 操作最长等待时间
    driver_terminate_timeout_s: 0.5      # 终止卡死子进程的等待时间
    driver_restart_interval_s: 1.0       # 自动重启最小间隔

# 控制仲裁（键盘 / 手柄 / Web / 导航）
base_control_router:
  ros__parameters:
    keyboard_angular_speed: 0.5                 # 键盘统一旋转速度（rad/s）
    keyboard_linear_speeds: [0.1, 0.3, 0.6, 1.0] # 键盘各档位线速度（m/s）
    router_rate: 50.0                            # 路由器轮询/仲裁发布频率（Hz）
    web_cmd_timeout: 0.4                         # 网页控制输入超时（s）
    nav_cmd_timeout: 0.4                         # 导航控制输入超时（s）
    nav_cmd_vel_topic: '/nav_cmd_vel'            # 导航控制器输出，先进入仲裁器
    nav_clear_topic: '/nav_clear'                # 仲裁器抢停导航时发布清空信号
    router_status_topic: '/base_control_router/status' # 仲裁器事件状态，供语音/上层业务订阅
