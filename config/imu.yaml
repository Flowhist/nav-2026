dm_imu:
  ros__parameters:
    # ==================== 串口连接 ====================
    port: "/dev/serial/by-id/usb-DM-Tech_DM-IMU-L1_DMIMU20250212-if00"       # USB串口
    baudrate: 921600           # 波特率
    
    # 坐标系（ekf.yaml 中配置 TF 变换关系）
    frame_id: "imu_link"
    
    # 话题发布配置
    publish_imu_data: true      # 发布 /imu/data (sensor_msgs/Imu) - 供EKF使用
    publish_rpy: false          # 发布 /imu/rpy (geometry_msgs/Vector3Stamped)
    publish_rate: 50.0          # IMU话题发布频率(Hz)
    
    # RPY单位（false=弧度，true=度）
    publish_rpy_in_degree: false
    
    # 固定航向偏置（度）
    yaw_offset_deg: 180.0

    # EKF 不再融合六轴 IMU 的绝对 yaw，保留下列历史实测值但禁用补偿。
    yaw_drift_compensation_enable: false
    yaw_drift_rate_deg_s: -0.01626810

    # 陀螺仪固定零偏（多轮静止采样结果），启动后立即应用。
    gyro_bias_x: 0.0
    gyro_bias_y: 0.0
    gyro_bias_z: -0.004357682

    # QoS配置
    qos_reliable: true         # 使用RELIABLE传输
    
    # 调试
    verbose: false             # 打印调试信息
