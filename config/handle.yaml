# The handle command is valid only when both the HID joystick and STM32 Modbus gear are online.
handle_control:
  ros__parameters:
    enabled: true
    port: "/dev/serial/by-path/platform-3610000.usb-usb-0:2.3.3:1.0-port0"
    hid_device: "/dev/input/by-id/usb-ShenZhenXiaoLong_SMC25usb32_8D8531A84856-joystick"
    baudrate: 115200
    slave_id: 1
    serial_timeout: 0.05
    poll_rate: 50.0
    speed_write_rate: 10.0
    reconnect_interval: 1.0

    # Measured HID mapping: forward/left are positive and the stick returns to zero.
    linear_axis: 1
    angular_axis: 0
    linear_direction: 1.0
    angular_direction: 1.0
    # 二维径向死区：保持摇杆任意方向连续，并将斜向满幅限制在单位圆内。
    dead_zone: 0.05
    saturation: 1.0

    # Gear 1..5 scales both limits to 20%, 40%, 60%, 80%, 100%.
    max_linear_speed: 0.6
    max_angular_speed: 0.5

    # 默认由底盘电机 profile 负责动态平滑，避免手柄层与电机层双重爬坡。
    # 如需恢复手柄层平滑，可打开此开关；以下线/角速率才会生效。
    command_smoothing_enabled: false
    # Linear rates are m/s^2; angular rates are rad/s^2.
    linear_accel_slew_rate: 1.5
    linear_decel_slew_rate: 6.0
    angular_accel_slew_rate: 3.1415926536
    angular_decel_slew_rate: 6.2831853072

    joy_topic: "/joy"
    state_topic: "/js_state"
    cmd_vel_topic: "/js_cmd_vel"
    buttons_topic: "/handle/buttons"
    gear_topic: "/handle/gear"
    navigation_button_topic: "/handle/navigation_button"
    odometry_topic: "/odom_encoder"
