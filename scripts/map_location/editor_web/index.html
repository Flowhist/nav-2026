<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Finav 本地地图编辑器</title>
  <link rel="stylesheet" href="editor.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">F</span><div><strong>地图编辑器</strong><small>FINAV LOCAL WORKBENCH</small></div></div>
    <label class="map-picker">当前地图
      <select id="mapSelect" aria-label="选择地图"></select>
    </label>
    <div class="history">
      <button id="undoButton" title="撤销 Ctrl+Z">↶ 撤销</button>
      <button id="redoButton" title="重做 Ctrl+Shift+Z">↷ 重做</button>
    </div>
    <span id="saveState" class="save-state" aria-live="polite">正在载入…</span>
    <button id="exportButton" class="primary">导出新地图</button>
  </header>

  <main class="workbench">
    <aside class="left-panel">
      <section class="tools">
        <h2>编辑工具</h2>
        <div class="tool-grid">
          <button data-tool="select" class="active"><span>⌖</span>选择</button>
          <button data-tool="location"><span>◎</span>目标点</button>
          <button data-tool="keepout"><span>▱</span>禁行区</button>
          <button data-tool="route"><span>⌁</span>巡航路线</button>
        </div>
        <p id="toolHint" class="hint">单击选择；拖拽对象或控制点进行编辑。</p>
      </section>
      <section class="objects">
        <div class="section-title"><h2>地图对象</h2><span id="objectCount">0</span></div>
        <input id="objectSearch" class="object-search" type="search" placeholder="搜索对象…" aria-label="搜索地图对象">
        <div id="objectTree" class="object-tree"></div>
      </section>
      <div class="shortcuts">
        <strong>快捷操作</strong>
        <span><kbd>Del</kbd> 删除选中项</span>
        <span><kbd>Esc</kbd> 取消当前绘制</span>
        <span><kbd>Enter</kbd> 完成路线</span>
      </div>
    </aside>

    <section class="viewport">
      <canvas id="mapCanvas" tabindex="0" aria-label="地图编辑画布"></canvas>
      <div class="canvas-toolbar">
        <button id="zoomOut" title="缩小">−</button>
        <span id="zoomLabel">100%</span>
        <button id="zoomIn" title="放大">＋</button>
        <button id="fitMap">适应</button>
      </div>
      <div id="coordinates" class="coordinates">x 0.000 · y 0.000</div>
      <div id="emptyState" class="empty-state" hidden>
        <strong>没有可编辑地图</strong>
        <span>请先在 maps 目录中放入地图文件夹。</span>
      </div>
      <div id="toastRegion" class="toasts" aria-live="assertive"></div>
    </section>

    <aside class="right-panel">
      <div class="section-title"><h2>属性</h2><span id="selectionType">未选择</span></div>
      <div id="propertyPanel" class="property-panel">
        <div class="no-selection"><span>◇</span><p>从左侧列表或地图中选择对象</p></div>
      </div>
    </aside>
  </main>

  <dialog id="exportDialog">
    <form method="dialog" id="exportForm">
      <div class="dialog-head"><h2>导出衍生地图</h2><button value="cancel" aria-label="关闭">×</button></div>
      <p>禁行区会写入新的占据栅格；原地图不会改变。目标点和路线将一并复制并重新校验。</p>
      <label>新地图名称<input id="exportName" name="target_name" required pattern="[A-Za-z0-9\u4e00-\u9fff][A-Za-z0-9_\-\u4e00-\u9fff]*" autocomplete="off"></label>
      <div class="dialog-actions"><button value="cancel">取消</button><button id="confirmExport" value="default" class="primary">开始导出</button></div>
    </form>
  </dialog>

  <script src="editor_state.js"></script>
  <script src="editor_canvas.js"></script>
  <script src="editor_panels.js"></script>
</body>
</html>
